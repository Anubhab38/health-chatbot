<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Health-Mitra</title>
    <!-- Zalando Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007AFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.48 12H2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="flex flex-col min-h-screen">
    
    <!-- Sticky Navbar -->
    <header id="main-navbar" class="sticky top-0 z-[100] w-full apple-navbar">
      <div class="w-full px-6 h-[56px] flex items-center justify-between relative z-10">
        <div class="flex items-center gap-2 shrink-0">
          <div class="w-[26px] h-[26px] rounded-[12px] bg-[rgba(255,255,255,0.18)] flex items-center justify-center text-white">
            <i data-lucide="activity" class="w-[14px] h-[14px]"></i>
          </div>
          <span class="text-headline">HEALTH-MITRA</span>
        </div>
        
        <div class="flex items-center gap-4 md:gap-[16px] shrink-0">
          <!-- Desktop Nav Links -->
          <div class="hidden md:flex items-center gap-[20px]">
            <button id="new-chat-btn" class="btn-primary btn-glow-blue">
              <i data-lucide="plus" class="w-[16px] h-[16px]"></i>
              <span>New Chat</span>
            </button>
            <div class="flex items-center gap-[8px]">
              <a href="#" class="nav-link">About</a>
              <a href="#" class="nav-link contact-trigger">Contact</a>
            </div>
          </div>

          <!-- Mobile Nav (Dropdown + Icon Button) -->
          <div class="flex md:hidden items-center gap-2 relative">
            <button id="new-chat-btn-mobile" class="btn-primary btn-primary-mobile btn-glow-blue">
              <i data-lucide="plus" class="w-[20px] h-[20px]"></i>
            </button>
            <button id="mobile-menu-btn" class="icon-btn w-8 h-8 flex items-center justify-center rounded-full text-[rgba(255,255,255,0.82)] hover:bg-[rgba(255,255,255,0.14)] hover:text-white transition-colors">
              <i data-lucide="more-vertical" class="w-[20px] h-[20px]"></i>
            </button>
            <!-- Dropdown -->
            <div id="mobile-dropdown" class="absolute top-[40px] right-0 w-[150px] dropdown-menu hidden flex-col p-2 gap-1 z-50">
              <a href="#" class="nav-link w-full text-left" style="color:var(--color-label-secondary);">About</a>
              <a href="#" class="nav-link contact-trigger w-full text-left" style="color:var(--color-label-secondary);">Contact</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex flex-1 flex-col w-full relative">
      <div class="max-w-[760px] w-full mx-auto px-5 pt-6 pb-[140px] flex-1 flex flex-col gap-4" id="chat-container">
        
        <!-- Empty State (shown initially) -->
        <div id="empty-state" class="flex flex-col items-center justify-center mt-12 mb-8 animate-[slideUpFade_0.5s_ease-out]">
          <div class="w-16 h-16 rounded-full bot-avatar flex items-center justify-center text-white mb-6 shadow-[0_8px_24px_rgba(88,86,214,0.35)]">
            <i data-lucide="activity" class="w-8 h-8"></i>
          </div>
          <h1 class="text-large-title text-center mb-6">How can I help you today?</h1>
          <div class="flex flex-wrap justify-center gap-2 max-w-lg">
            <button class="suggestion-btn btn-glow-blue bg-[var(--color-bg-card)] border border-[var(--color-border-light)] rounded-[999px] px-4 py-2.5 text-callout hover:shadow-sm">
              I have a headache
            </button>
            <button class="suggestion-btn btn-glow-blue bg-[var(--color-bg-card)] border border-[var(--color-border-light)] rounded-[999px] px-4 py-2.5 text-callout hover:shadow-sm">
              First aid for burns
            </button>
            <button class="suggestion-btn btn-glow-blue bg-[var(--color-bg-card)] border border-[var(--color-border-light)] rounded-[999px] px-4 py-2.5 text-callout hover:shadow-sm">
              Healthy diet tips
            </button>
          </div>
        </div>

      </div>

      <!-- Input Bar (Floating Sticky Bottom) -->
      <div class="sticky bottom-0 w-full input-bar-fade z-50">
        <div class="w-full max-w-[760px] mx-auto px-5 pt-4 pb-5">
          <form id="chat-form" class="input-pill">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Message..."
              class="flex-1 bg-transparent border-none outline-none resize-none text-body py-1.5 max-h-[140px]"
            ></textarea>

            <button type="submit" id="send-btn" disabled class="btn-send btn-glow-white w-[36px] h-[36px] rounded-full flex items-center justify-center shrink-0">
              <i data-lucide="arrow-up" class="w-[18px] h-[18px]"></i>
            </button>
          </form>
          <div class="text-center mt-3">
            <span class="text-footnote text-[var(--color-label-tertiary)]">This assistant can make mistakes. Verify important information with a doctor.</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Optional Thin Footer -->
    <footer class="w-full bg-[var(--color-bg-card)] border-t border-[var(--color-divider)] py-4 px-5">
      <div class="max-w-[760px] mx-auto text-center text-footnote text-[var(--color-label-secondary)]">
        © 2026 Health-Mitra. All rights reserved. 
        <span class="mx-1">·</span> 
        <a href="#" class="hover:underline">Privacy</a> 
        <span class="mx-1">·</span> 
        <a href="#" class="hover:underline">Terms</a>
      </div>
    </footer>

    <!-- Contact Modal -->
    <div id="contact-modal" class="contact-modal-overlay fixed inset-0 z-[200] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
      <div class="card relative">
        <button id="close-contact-modal" class="absolute top-4 right-4 text-[var(--color-label-secondary)] hover:text-[var(--color-label-primary)] transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <h2 class="card__title">Contact Us</h2>
        <p class="card__content">We'd love to hear from you.</p>
        <form class="card__form">
          <input type="text" placeholder="Name" required />
          <input type="email" placeholder="Email" required />
          <textarea placeholder="Message" rows="3" required></textarea>
          <button type="submit" class="sign-up">Send Message</button>
        </form>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      // Initialize Lucide Icons
      lucide.createIcons();

      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const chat = document.getElementById("chat-container");
      const sendBtn = document.getElementById("send-btn");
      const emptyState = document.getElementById("empty-state");
      
      // Auto-grow textarea
      input.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = (this.scrollHeight) + "px";
        
        if(this.value.trim().length > 0) {
          sendBtn.removeAttribute("disabled");
        } else {
          sendBtn.setAttribute("disabled", "true");
        }
      });

      // Glow Burst Ripple Function
      function spawnRipple(e, el, color) {
        const rect = el.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 1.2;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
        el.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      // Attach Ripple to elements
      document.addEventListener('pointerdown', (e) => {
        const targetBlue = e.target.closest('.btn-glow-blue');
        if(targetBlue && !targetBlue.disabled) spawnRipple(e, targetBlue, 'rgba(0,122,255,0.35)');

        const targetWhite = e.target.closest('.btn-glow-white');
        if(targetWhite && !targetWhite.disabled) spawnRipple(e, targetWhite, 'rgba(255,255,255,0.55)');
      });

      // Handle suggestion pills
      document.querySelectorAll(".suggestion-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          input.value = btn.textContent.trim();
          input.dispatchEvent(new Event('input'));
          input.focus();
        });
      });

      // Send on Enter
      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if(input.value.trim().length > 0) form.requestSubmit();
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        if(emptyState) emptyState.style.display = "none";
        appendUserMessage(text);
        
        input.value = "";
        input.style.height = "auto";
        sendBtn.setAttribute("disabled", "true");

        const typingId = appendTypingIndicator();

        try {
          const apiUrl = window.location.protocol === 'file:' 
            ? "http://127.0.0.1:4000/api/message" 
            : "/api/message";
            
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          const data = await res.json();
          const reply = data.answer || "⚠️ No reply.";
          
          removeTypingIndicator(typingId);
          appendBotMessage(reply);
          
        } catch (err) {
          console.error(err);
          removeTypingIndicator(typingId);
          appendBotMessage("⚠️ Error: Could not connect to backend.");
        }
      });

      function appendUserMessage(text) {
        const wrapper = document.createElement("div");
        wrapper.className = "flex justify-end w-full bubble-enter";
        
        const bubble = document.createElement("div");
        bubble.className = "msg-user";
        bubble.textContent = text;
        
        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        scrollToBottom();
      }

      function appendBotMessage(text) {
        const wrapper = document.createElement("div");
        wrapper.className = "flex items-end gap-2 w-full bubble-enter";
        
        const avatar = document.createElement("div");
        avatar.className = "w-7 h-7 rounded-full bot-avatar flex-shrink-0 flex items-center justify-center text-white mb-[22px] shadow-sm";
        avatar.innerHTML = '<i data-lucide="activity" class="w-[14px] h-[14px]"></i>';
        
        const bubbleContainer = document.createElement("div");
        bubbleContainer.className = "flex flex-col gap-1 w-full max-w-[70%]";
        
        const bubble = document.createElement("div");
        bubble.className = "msg-bot max-w-full";
        bubble.textContent = text;
        
        const timestamp = document.createElement("span");
        timestamp.className = "text-callout text-[var(--color-label-tertiary)] ml-2 mt-1";
        const now = new Date();
        timestamp.textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        bubbleContainer.appendChild(bubble);
        bubbleContainer.appendChild(timestamp);
        
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubbleContainer);
        chat.appendChild(wrapper);
        lucide.createIcons();
        scrollToBottom();
      }

      function appendTypingIndicator() {
        const id = 'typing-' + Date.now();
        const wrapper = document.createElement("div");
        wrapper.id = id;
        wrapper.className = "flex items-end gap-2 w-full bubble-enter";
        
        const avatar = document.createElement("div");
        avatar.className = "w-7 h-7 rounded-full bot-avatar flex-shrink-0 flex items-center justify-center text-white mb-1 shadow-sm";
        avatar.innerHTML = '<i data-lucide="activity" class="w-[14px] h-[14px]"></i>';
        
        const bubble = document.createElement("div");
        bubble.className = "msg-bot flex items-center gap-1.5 px-4 h-[42px] max-w-fit";
        bubble.innerHTML = `
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        `;
        
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        lucide.createIcons();
        scrollToBottom();
        
        return id;
      }

      function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if(el) el.remove();
      }

      function scrollToBottom() {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: 'smooth'
        });
      }

      // --- Navbar Interactions ---
      const mainNavbar = document.getElementById("main-navbar");
      const newChatBtns = [document.getElementById("new-chat-btn"), document.getElementById("new-chat-btn-mobile")];
      const mobileMenuBtn = document.getElementById("mobile-menu-btn");
      const mobileDropdown = document.getElementById("mobile-dropdown");

      // Mobile Menu Toggle
      mobileMenuBtn.addEventListener("click", () => {
        mobileDropdown.classList.toggle("hidden");
        mobileDropdown.classList.toggle("flex");
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!mobileDropdown.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
          mobileDropdown.classList.add("hidden");
          mobileDropdown.classList.remove("flex");
        }
      });

      // --- Contact Modal ---
      const contactModal = document.getElementById("contact-modal");
      const closeContactModal = document.getElementById("close-contact-modal");
      const contactTriggers = document.querySelectorAll(".contact-trigger");

      contactTriggers.forEach(trigger => {
        trigger.addEventListener('click', (e) => {
          e.preventDefault();
          contactModal.classList.remove("opacity-0", "pointer-events-none");
          contactModal.classList.add("opacity-100", "active");
          // Close mobile menu if open
          mobileDropdown.classList.add("hidden");
          mobileDropdown.classList.remove("flex");
        });
      });

      closeContactModal.addEventListener('click', () => {
        contactModal.classList.remove("opacity-100", "active");
        contactModal.classList.add("opacity-0", "pointer-events-none");
      });

      contactModal.addEventListener('click', (e) => {
        if (e.target === contactModal) {
          contactModal.classList.remove("opacity-100", "active");
          contactModal.classList.add("opacity-0", "pointer-events-none");
        }
      });

      // New Chat Trigger (Pulse Flash)
      newChatBtns.forEach(btn => {
        if(!btn) return;
        btn.addEventListener("click", () => {
          const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          mainNavbar.classList.add("navbar--pulse");

          // Reset Chat Stream
          const messages = chat.querySelectorAll('.bubble-enter, .flex.justify-end, .flex.items-end');
          messages.forEach(msg => {
            if(msg.id !== 'empty-state') msg.remove();
          });

          if(emptyState) {
            emptyState.style.display = "flex";
            emptyState.classList.remove("animate-[slideUpFade_0.5s_ease-out]");
            void emptyState.offsetWidth; // trigger reflow
            emptyState.classList.add("animate-[slideUpFade_0.5s_ease-out]");
          }

          const holdDuration = prefersReducedMotion ? 200 : 500;
          setTimeout(() => {
            mainNavbar.classList.remove("navbar--pulse");
          }, holdDuration);
        });
      });
    </script>
  </body>
</html>
